# Contact points provisionnés (STR-167, ADR 021) — la vérité vit dans git.
# En dev, Grafana envoie via Mailpit (GF_SMTP_HOST=mailpit:1025) : les emails
# d'alerte sont visibles sur http://localhost:8025. En prod, GF_SMTP_* pointe
# le relay SMTP réel (mêmes variables que l'API).
#
# L'adresse vient de l'environnement (STR-244) : elle était auparavant codée en
# dur sur un domaine placeholder qui n'appartient pas au projet. Une alerte
# envoyée à un domaine qu'on ne contrôle pas ne prévient personne — et si le
# domaine venait à exister, elle préviendrait quelqu'un d'autre. Défaut en
# .invalid (RFC 2606) : non délivrable par construction, donc jamais adressé
# à un tiers par accident.
#
# Syntaxe `$VAR` et non `${VAR}` : c'est la forme documentée par Grafana pour le
# provisioning d'alerting, et `${VAR}` déclenche une double expansion si la valeur
# contient elle-même un `$`. ⚠️ L'interpolation ne s'applique PAS aux annotations
# de règles d'alerte — ne pas y attendre de variable d'environnement.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: equipe-streampulse
    receivers:
      - uid: email-equipe
        type: email
        settings:
          addresses: $ALERT_EMAIL_TO
          singleEmail: true

      # Second canal, dans le MÊME contact point : la politique de notification
      # route vers un contact point, pas vers un type. Les deux receivers sont
      # donc notifiés sans toucher à policies.yml.
      #
      # Ajouté parce que l'email n'a jamais eu de destinataire réel — son défaut
      # est une adresse en .invalid, et le déploiement Kubernetes ne passait même
      # pas la variable. Discord est le canal que l'équipe lit vraiment.
      #
      # ⚠️ `url` est un champ SECRET et OBLIGATOIRE pour Grafana. Une valeur vide
      # n'est pas un canal « désactivé » : le provisioning est rejeté à la
      # validation — « could not find webhook url property in settings » — et
      # comme l'échec porte sur le module `provisioning`, **Grafana refuse de
      # démarrer** (constaté : exit 1, 29 modules en échec). L'email tomberait
      # avec lui. D'où un défaut non vide côté compose, sur le TLD réservé
      # .invalid (RFC 2606) — même procédé que pour ALERT_EMAIL_TO.
      #
      # Non configuré, ce receiver échoue donc à l'ENVOI et non au démarrage :
      # « dial tcp: lookup discord.invalid : no such host », erreur classée
      # irrécupérable (une seule tentative, pas de rafale de reprises). Mesuré :
      # l'email part quand même, et une seule fois — les intégrations d'un
      # contact point sont notifiées indépendamment. L'absence de configuration
      # reste visible dans Grafana → Alerting → Contact points.
      #
      # `disableResolveMessage` n'est pas posé : sa valeur par défaut (false)
      # est déjà celle qu'on veut, et on veut bien le message de rétablissement
      # — une alerte qui ne dit jamais qu'elle est retombée entraîne à ignorer
      # le canal.
      - uid: discord-equipe
        type: discord
        settings:
          url: $ALERT_DISCORD_WEBHOOK
