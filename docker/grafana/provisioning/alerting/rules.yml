# Règles d'alerte provisionnées (STR-167 / STR-189 / STR-244, ADR 021 et 041).
# Évaluation chaque minute, déclenchement après 5 minutes au-dessus du seuil
# (`for: 5m`). Datasource : uid `prometheus` (provisionnée ADR 001).
#
# Format : chaque règle porte une requête A (PromQL) et une condition C
# (threshold) — le modèle « classic condition » simple de Grafana alerting.
apiVersion: 1

groups:
  - orgId: 1
    name: streampulse-critiques
    folder: StreamPulse
    interval: 1m
    rules:
      - uid: alerte-taux-5xx
        title: Taux d'erreurs HTTP 5xx > 5%
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Plus de 5% des requêtes HTTP échouent en 5xx sur 5 minutes (trafic significatif)."
          description: "Le ratio n'est évalué qu'au-dessus de 0,1 req/s (~30 requêtes sur 5 min) : en dessous, une erreur isolée donnerait un ratio trompeur. Vérifier les logs {service=\"api\"} | json | level=\"error\" dans Loki, puis remonter à la trace via le TraceID."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: ((sum(rate(http_requests_total{status=~"5.."}[5m])) or vector(0)) / sum(rate(http_requests_total[5m]))) and (sum(rate(http_requests_total[5m])) > 0.1)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        noDataState: OK
        execErrState: Error

      - uid: alerte-cpu-machine
        title: CPU machine > 90%
        condition: C
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CPU au-dessus de 90% depuis 5 minutes (node_exporter)."
          description: "Vérifier le dashboard Infrastructure (goroutines, heap) et les flux HLS actifs."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.9] }
        noDataState: NoData
        execErrState: Error

      - uid: alerte-goroutines
        title: Goroutines API > 200
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 200 goroutines depuis 5 minutes — fuite probable (baseline ~15, pic légitime 50 auditeurs < 100)."
          description: "Comparer avec streams/auditeurs actifs ; pprof si la croissance est monotone (STR-89)."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: go_goroutines{job="api"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [200] }
        noDataState: NoData
        execErrState: Error

      - uid: alerte-api-injoignable
        title: API injoignable
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus ne parvient plus à scraper l'API depuis 2 minutes."
          description: "Panne totale ou conteneur arrêté : la règle sur le taux de 5xx ne peut pas la détecter (plus aucune requête n'est comptée). Vérifier `docker compose ps` et les logs du service api."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="api"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: Alerting
        execErrState: Error

  # Alertes métier (STR-244, ADR 041). Le sujet demande explicitement de
  # distinguer « les erreurs 500 (techniques) du nombre de déconnexions brutales
  # d'utilisateurs (métier/expérience) ». Les quatre règles ci-dessus sont toutes
  # techniques : aucune ne se déclenche si la plateforme sert parfaitement des
  # 200 à personne. Celles-ci portent sur ce que vivent les auditeurs.
  #
  # Groupe séparé et non simples règles ajoutées au précédent : l'intervalle
  # d'évaluation est porté par le groupe, et une interruption de diffusion se
  # constate à la minute alors qu'un pic de CPU se juge sur une fenêtre.
  - orgId: 1
    name: streampulse-metier
    folder: StreamPulse
    interval: 1m
    rules:
      # Cette règle ne porte QUE sur reason="segmenter_failed" (revue PR #328).
      #
      # L'ADR 041 distingue les deux causes précisément parce qu'elles n'appellent
      # pas la même intervention — puis alertait sur les deux, ce qui était
      # incohérent. Côté diffuseur, fermer l'application, passer en arrière-plan
      # ou sortir de couverture produit un `ingest_timeout` identique à une perte
      # réseau : sur une plateforme au churn normal, cette alerte serait presque
      # toujours active et noierait le seul cas actionnable, le crash de ffmpeg.
      #
      # `ingest_timeout` reste compté et visible sur le panneau « Interruptions
      # de diffusion » du dashboard Live Streaming : mesurer n'oblige pas à
      # réveiller quelqu'un.
      - uid: alerte-diffusion-interrompue
        title: Segmenteur HLS arrêté seul (diffusion perdue côté serveur)
        condition: C
        # for: 0m — contrairement aux règles techniques, l'événement est ponctuel
        # et déjà consommé quand on le lit : exiger qu'il « dure » 5 minutes
        # reviendrait à exiger qu'une seconde diffusion tombe pour être prévenu
        # de la première.
        for: 0m
        labels:
          severity: warning
          domain: metier
        annotations:
          summary: "ffmpeg s'est arrêté seul sur au moins une diffusion dans les 15 dernières minutes."
          description: "Panne côté serveur : la diffusion est perdue alors que le diffuseur poussait toujours. Chercher les lignes du segmenteur dans Loki : {service=\"api\"} | json | component=\"ffmpeg-hls\". Les arrêts côté diffuseur (reason=ingest_timeout — application fermée, réseau perdu) ne déclenchent PAS cette alerte : ils sont normaux et se lisent sur le panneau « Interruptions de diffusion »."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(increase(streampulse_stream_interruptions_total{reason="segmenter_failed"}[15m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        # OK et non NoData : tant qu'aucune diffusion n'a jamais été interrompue,
        # la série n'existe pas — c'est le cas nominal, pas une panne de mesure.
        noDataState: OK
        execErrState: Error

      - uid: alerte-erreurs-segments
        title: Segments HLS en échec > 5%
        condition: C
        for: 5m
        labels:
          severity: critical
          domain: metier
        annotations:
          summary: "Plus de 5% des segments audio demandés sont refusés depuis 5 minutes."
          description: "Ce que cela vaut côté auditeur : de l'audio qui se coupe. Le ratio n'est évalué qu'au-dessus de 0,2 segment/s, sinon un unique 404 sur une diffusion sans public suffirait à alerter. Vérifier d'abord les rejets de capacité (HLS_MAX_CONCURRENT, panel « Rejets de capacité HLS ») avant de conclure à une panne."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: ((sum(rate(streampulse_hls_requests_total{kind="segment",status=~"4..|5.."}[5m])) or vector(0)) / sum(rate(streampulse_hls_requests_total{kind="segment"}[5m]))) and (sum(rate(streampulse_hls_requests_total{kind="segment"}[5m])) > 0.2)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }
        # OK : sans diffusion en cours, il n'y a pas de segment à servir. Une
        # absence de données est ici l'état normal d'une plateforme au repos.
        noDataState: OK
        execErrState: Error
