openapi: 3.0.3
info:
  title: StreamPulse API
  version: 0.1.0
  description: REST API for the StreamPulse backend.
servers:
  - url: /
tags:
  - name: Health
    description: Operational endpoints.
  - name: Metrics
    description: Observability endpoints.
  - name: Auth
    description: Authentication and password reset endpoints.
  - name: Profile
    description: Current user profile endpoints.
  - name: Broadcaster
    description: Broadcaster role requests and admin review.
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check API health.
      responses:
        "200":
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    status: ok
        "500":
          $ref: "#/components/responses/InternalError"
  /metrics:
    get:
      tags:
        - Metrics
      operationId: getMetrics
      summary: Expose Prometheus metrics.
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Register a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Authenticate a user and issue tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token pair issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: Rotate a refresh token and issue a new token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token pair rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Revoke the current refresh token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Refresh token revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/forgot-password:
    post:
      tags:
        - Auth
      operationId: forgotPassword
      summary: Request a password reset email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Password reset request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                accepted:
                  value:
                    message: if this email is registered, you will receive a password reset link shortly
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/reset-password:
    post:
      tags:
        - Auth
      operationId: resetPassword
      summary: Reset a password with a valid reset token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                updated:
                  value:
                    message: password updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/me:
    delete:
      tags:
        - Auth
      operationId: deleteAccount
      summary: Permanently delete the authenticated user's account (GDPR art. 17).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Account permanently deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users/me:
    get:
      tags:
        - Profile
      operationId: getMyProfile
      summary: Retrieve the authenticated user's profile.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Profile
      operationId: updateMyProfile
      summary: Update the authenticated user's profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/broadcaster-requests:
    post:
      tags:
        - Broadcaster
      operationId: createBroadcasterRequest
      summary: Submit a request to become a broadcaster.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcasterRequestInput"
      responses:
        "201":
          description: Broadcaster request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcasterRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/broadcaster-requests/me:
    get:
      tags:
        - Broadcaster
      operationId: getMyBroadcasterRequest
      summary: Retrieve the authenticated user's latest broadcaster request.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Latest broadcaster request for the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcasterRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/broadcaster-requests:
    get:
      tags:
        - Broadcaster
      operationId: listBroadcasterRequests
      summary: List broadcaster requests (admin only).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Optional status filter.
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Broadcaster requests, most recent first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcasterRequestListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/broadcaster-requests/{id}/approve:
    post:
      tags:
        - Broadcaster
      operationId: approveBroadcasterRequest
      summary: Approve a broadcaster request and promote the user (admin only).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BroadcasterRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequestInput"
      responses:
        "200":
          description: Updated broadcaster request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcasterRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/broadcaster-requests/{id}/reject:
    post:
      tags:
        - Broadcaster
      operationId: rejectBroadcasterRequest
      summary: Reject a broadcaster request (admin only).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BroadcasterRequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequestInput"
      responses:
        "200":
          description: Updated broadcaster request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcasterRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/streams:
    post:
      tags:
        - Streaming
      operationId: createStream
      summary: Create and configure a new live stream (broadcaster only).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStreamRequest"
      responses:
        "201":
          description: The newly created stream, including its source URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags:
        - Streaming
      operationId: listStreams
      summary: List public live streams (paginated).
      description: >-
        Public endpoint: no authentication required. Guests can discover live
        streams (US-04-01). Never exposes any secret (stream_key, source URL).
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Public live streams (without any secret).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StreamSummaryResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/streams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Streaming
      operationId: getStream
      summary: Get a stream by id.
      description: >-
        The owner receives the full stream (including stream_key and
        stream_source_url). Other users receive a public summary without
        secrets. A private stream owned by someone else returns 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >-
            The stream. For the owner, stream_key and stream_source_url are
            populated; for any other user they are null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Streaming
      operationId: updateStream
      summary: Update a stream (owner only).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStreamRequest"
      responses:
        "200":
          description: The updated stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Streaming
      operationId: deleteStream
      summary: Delete (archive) a stream (owner only).
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The stream was archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/streams/{id}/start:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Streaming
      operationId: startStream
      summary: Start a stream — go live (broadcaster owner only).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The stream is now live (status live, started_at set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The stream is not idle, or the broadcaster already has a live stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/streams/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Streaming
      operationId: stopStream
      summary: Stop a live stream — end it (broadcaster owner only).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The stream is now ended (status ended, ended_at set).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The stream is not live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/streams/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Streaming
      operationId: streamEvents
      summary: Subscribe to a live stream's events (SSE).
      description: >-
        Server-Sent Events stream. The subscriber receives an `ended` event when
        the broadcaster stops the stream. Requires the stream to be live.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SSE stream of events (text/event-stream).
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The stream is not live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/streams/{id}/favorite:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - Streaming
      operationId: addFavorite
      summary: Add a stream to the authenticated user's favorites.
      description: >-
        Adds the stream to the user's favorites (US-04-05). Idempotent (PUT):
        adding an already-favorited stream succeeds. A stream that is not visible
        to the requester (private and owned by someone else, archived, or
        unknown) returns 404.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The stream is in the user's favorites.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Streaming
      operationId: removeFavorite
      summary: Remove a stream from the authenticated user's favorites.
      description: >-
        Removes the stream from the user's favorites. Idempotent: removing a
        stream that is not in the favorites succeeds.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The stream is no longer in the user's favorites.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users/me/favorites:
    get:
      tags:
        - Streaming
      operationId: listMyFavorites
      summary: List the authenticated user's favorite streams.
      description: >-
        Returns the user's favorite streams (all statuses), still visible and not
        archived, ordered by favorite date descending. Never exposes any secret
        (stream_key, source URL).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's favorite streams (without any secret).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StreamSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/streams/ingest/{stream_key}:
    parameters:
      - name: stream_key
        in: path
        required: true
        description: The broadcaster's secret stream key (from stream_source_url).
        schema:
          type: string
    post:
      tags:
        - Streaming
      operationId: ingestStream
      summary: Push a live audio stream (broadcaster ingest).
      description: >-
        Continuous AAC audio ingest for a live stream, authenticated by the
        `stream_key` in the path (no JWT). The request body is a continuous audio
        stream segmented into HLS by the backend (cf. ADR 015). The stream must be
        live (started) for the push to be accepted.
      requestBody:
        required: true
        content:
          audio/aac:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Ingest completed (broadcaster disconnected).
        "404":
          description: No live stream for this key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An ingest is already in progress for this stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: >-
            Content-Type present but not audio/* (a non-audio push would spin the
            HLS demuxer without producing segments). An absent Content-Type is
            accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/streams/{id}/playlist.m3u8:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Streaming
      operationId: streamPlaylist
      summary: Get the live HLS media playlist (manifest).
      description: >-
        Public — authentication is optional (native HLS players cannot carry a
        Bearer token). Returns the continuously-updated HLS media playlist (`.m3u8`)
        of a live **public** stream. Segment URIs are relative (`segments/…`). A
        private or absent stream returns 404; an owner passing a valid Bearer may
        also access their own private stream.
      responses:
        "200":
          description: HLS media playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The stream is not live, or its manifest is not ready yet (window
            between start and the first segment).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            Server at listener capacity (HLS_MAX_CONCURRENT concurrent requests
            reached). Retry after the delay given in the Retry-After header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/streams/{id}/segments/{segment}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: segment
        in: path
        required: true
        description: Segment file name (e.g. seg_00001.ts).
        schema:
          type: string
          pattern: '^seg_\d+\.ts$'
    get:
      tags:
        - Streaming
      operationId: streamSegment
      summary: Get an HLS media segment (.ts).
      description: >-
        Public — authentication is optional. Returns an MPEG-TS audio segment
        referenced by the live playlist of a **public** stream. A private or absent
        stream returns 404; an owner passing a valid Bearer may also access their
        own private stream.
      responses:
        "200":
          description: MPEG-TS segment.
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: >-
            Server at listener capacity (HLS_MAX_CONCURRENT concurrent requests
            reached). Retry after the delay given in the Retry-After header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BroadcasterRequestId:
      name: id
      in: path
      required: true
      description: Broadcaster request identifier.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request payload or invalid input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidJson:
              value:
                error:
                  code: invalid_json
                  message: invalid json body
            invalidArgument:
              value:
                error:
                  code: invalid_argument
                  message: invalid email
    Unauthorized:
      description: Authentication failed or bearer token is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: invalid credentials
    Conflict:
      description: Resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            duplicate:
              value:
                error:
                  code: conflict
                  message: email or username already taken
    Forbidden:
      description: The authenticated user lacks the required role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbidden:
              value:
                error:
                  code: forbidden
                  message: insufficient role
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              value:
                error:
                  code: not_found
                  message: resource not found
    UnsupportedMediaType:
      description: Request content type must be application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unsupported:
              value:
                error:
                  code: unsupported_media_type
                  message: content-type must be application/json
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                error:
                  code: internal
                  message: internal server error
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: ^[a-zA-Z0-9_]+$
          example: alice
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: hunter2hunter
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: hunter2hunter
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          example: 21ee4d0f5e8c4037a61f48c980b9b3e7dba2f1d3b4f2a9f1bb7be6f99f9f5ef9
    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          example: 21ee4d0f5e8c4037a61f48c980b9b3e7dba2f1d3b4f2a9f1bb7be6f99f9f5ef9
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 1
          example: a0a6d282d432a44f3a3a7e0d75a742f42df1a7f39a260ebc89b3b961df18dd41
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: newpassword1
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 1
          example: hunter2hunter
    UserResponse:
      type: object
      required:
        - id
        - email
        - username
        - role
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
        email:
          type: string
          format: email
          example: alice@example.com
        username:
          type: string
          example: alice
        role:
          type: string
          example: user
        created_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
    ProfileResponse:
      type: object
      required:
        - id
        - email
        - role
        - pseudo
        - bio
        - avatar_url
        - theme
        - notifications_enabled
        - audio_quality
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
        email:
          type: string
          format: email
          example: alice@example.com
        role:
          type: string
          example: user
        pseudo:
          type: string
          minLength: 3
          maxLength: 30
          example: alice
        bio:
          type: string
          maxLength: 280
          example: Music lover and night owl.
        avatar_url:
          type: string
          format: uri
          nullable: true
          example: https://cdn.streampulse.dev/avatars/alice.png
        theme:
          type: string
          enum: [system, light, dark]
          example: system
        notifications_enabled:
          type: boolean
          example: true
        audio_quality:
          type: string
          enum: [low, normal, high]
          example: normal
        created_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required:
        - pseudo
        - bio
        - theme
        - notifications_enabled
        - audio_quality
      properties:
        pseudo:
          type: string
          minLength: 3
          maxLength: 30
          pattern: ^[a-zA-Z0-9_ ]+$
          example: alice
        bio:
          type: string
          maxLength: 280
          example: Music lover and night owl.
        theme:
          type: string
          enum: [system, light, dark]
          example: dark
        notifications_enabled:
          type: boolean
          example: true
        audio_quality:
          type: string
          enum: [low, normal, high]
          example: high
    TokenPairResponse:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        refresh_token:
          type: string
          example: 21ee4d0f5e8c4037a61f48c980b9b3e7dba2f1d3b4f2a9f1bb7be6f99f9f5ef9
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    BroadcasterRequestInput:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          maxLength: 500
          description: Optional motivation message for the request.
          example: J'anime une émission hebdomadaire et souhaite diffuser en direct.
    ReviewRequestInput:
      type: object
      additionalProperties: false
      properties:
        review_note:
          type: string
          maxLength: 500
          description: Optional note explaining the admin decision.
          example: Profil complet, demande validée.
    BroadcasterRequestResponse:
      type: object
      required:
        - id
        - status
        - message
        - review_note
        - reviewed_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
        status:
          type: string
          enum: [pending, approved, rejected]
          example: pending
        message:
          type: string
          example: J'anime une émission hebdomadaire.
        review_note:
          type: string
          example: ""
        reviewed_by:
          type: string
          format: uuid
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
    BroadcasterRequestAdmin:
      allOf:
        - $ref: "#/components/schemas/BroadcasterRequestResponse"
        - type: object
          required:
            - user_id
            - email
            - username
          properties:
            user_id:
              type: string
              format: uuid
              example: 22222222-3333-4444-5555-666666666666
            email:
              type: string
              format: email
              example: alice@example.com
            username:
              type: string
              example: alice
    BroadcasterRequestListResponse:
      type: object
      required:
        - requests
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/BroadcasterRequestAdmin"
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: invalid_argument
        message:
          type: string
          example: invalid email
    CreateStreamRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - is_public
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
          example: Morning Jazz Session
        description:
          type: string
          maxLength: 500
          nullable: true
          example: A relaxing jazz set to start the day.
        category:
          type: string
          enum: [music, talk, technology, gaming, news, sport, other]
          nullable: true
          example: music
        is_public:
          type: boolean
          example: true
    StreamSummaryResponse:
      type: object
      required:
        - id
        - user_id
        - title
        - description
        - category
        - status
        - is_public
        - started_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        status:
          type: string
          enum: [idle, live, ended]
        is_public:
          type: boolean
        started_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    StreamResponse:
      type: object
      required:
        - id
        - user_id
        - title
        - description
        - category
        - status
        - is_public
        - started_at
        - ended_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
        user_id:
          type: string
          format: uuid
          example: 99999999-8888-7777-6666-555555555555
        title:
          type: string
          example: Morning Jazz Session
        description:
          type: string
          nullable: true
          example: A relaxing jazz set to start the day.
        category:
          type: string
          nullable: true
          example: music
        status:
          type: string
          enum: [idle, live, ended]
          example: idle
        is_public:
          type: boolean
          example: true
        stream_key:
          type: string
          nullable: true
          description: >-
            Secret push key. Populated only for the stream owner; null for any
            other user. Treat as a credential.
          example: 8Jk2xQ7pL3nR5tV9wB1cD4fG6hJ0kM2nP4qS6uW8yA
        stream_source_url:
          type: string
          format: uri
          nullable: true
          description: Populated only for the stream owner; null otherwise.
          example: http://localhost:8080/api/streams/ingest/8Jk2xQ7pL3nR5tV9wB1cD4fG6hJ0kM2nP4qS6uW8yA
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
