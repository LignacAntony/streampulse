        - message
      properties:
        message:
          type: string
    BroadcasterRequestInput:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          maxLength: 500
          description: Optional motivation message for the request.
          example: J'anime une émission hebdomadaire et souhaite diffuser en direct.
    ReviewRequestInput:
      type: object
      additionalProperties: false
      properties:
        review_note:
          type: string
          maxLength: 500
          description: Optional note explaining the admin decision.
          example: Profil complet, demande validée.
    BroadcasterRequestResponse:
      type: object
      required:
        - id
        - status
        - message
        - review_note
        - reviewed_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
        status:
          type: string
          enum: [pending, approved, rejected]
          example: pending
        message:
          type: string
          example: J'anime une émission hebdomadaire.
        review_note:
          type: string
          example: ""
        reviewed_by:
          type: string
          format: uuid
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
    BroadcasterRequestAdmin:
      allOf:
        - $ref: "#/components/schemas/BroadcasterRequestResponse"
        - type: object
          required:
            - user_id
            - email
            - username
          properties:
            user_id:
              type: string
              format: uuid
              example: 22222222-3333-4444-5555-666666666666
            email:
              type: string
              format: email
              example: alice@example.com
            username:
              type: string
              example: alice
    BroadcasterRequestListResponse:
      type: object
      required:
        - requests
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/BroadcasterRequestAdmin"
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: invalid_argument
        message:
          type: string
          example: invalid email
    CreateStreamRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - is_public
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
          example: Morning Jazz Session
        description:
          type: string
          maxLength: 500
          nullable: true
          example: A relaxing jazz set to start the day.
        category:
          type: string
          enum: [music, talk, technology, gaming, news, sport, other]
          nullable: true
          example: music
        is_public:
          type: boolean
          example: true
    StreamStatsResponse:
      type: object
      required:
        - stream_id
        - status
        - listeners
        - peak_listeners
        - duration_seconds
      properties:
        stream_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [idle, live, ended]
        listeners:
          type: integer
          description: >-
            Estimated number of distinct clients that fetched the manifest
            recently. Zero when the stream is not live.
          example: 12
        peak_listeners:
          type: integer
          description: >-
            Highest `listeners` value observed since the broadcast started.
            In-memory only: reset on process restart, lost when the stream ends.
          example: 27
        started_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          format: int64
          description: >-
            Seconds since `started_at` — up to now while live, up to `ended_at`
            once the broadcast is over. Zero if the stream never started.
          example: 3725
    StreamSummaryResponse:
      type: object
      required:
        - id
        - user_id
        - title
        - description
        - category
        - status
        - is_public
        - started_at
        - created_at
        - broadcaster_username
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        status:
          type: string
          enum: [idle, live, ended]
        is_public:
          type: boolean
        started_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        broadcaster_username:
          type: string
          description: Username of the broadcaster (display name in the listener UI).
    StreamResponse:
      type: object
      required:
        - id
        - user_id
        - title
        - description
        - category
        - status
        - is_public
        - started_at
        - ended_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
        user_id:
          type: string
          format: uuid
          example: 99999999-8888-7777-6666-555555555555
        title:
          type: string
          example: Morning Jazz Session
        description:
          type: string
          nullable: true
          example: A relaxing jazz set to start the day.
        category:
          type: string
          nullable: true
          example: music
        status:
          type: string
          enum: [idle, live, ended]
          example: idle
        is_public:
          type: boolean
          example: true
        stream_key:
          type: string
          nullable: true
          description: >-
            Secret push key. Populated only for the stream owner; null for any
            other user. Treat as a credential.
          example: 8Jk2xQ7pL3nR5tV9wB1cD4fG6hJ0kM2nP4qS6uW8yA
        stream_source_url:
          type: string
          format: uri
          nullable: true
          description: Populated only for the stream owner; null otherwise.
          example: http://localhost:8080/api/streams/ingest/8Jk2xQ7pL3nR5tV9wB1cD4fG6hJ0kM2nP4qS6uW8yA
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
