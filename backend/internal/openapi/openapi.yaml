openapi: 3.0.3
info:
  title: StreamPulse API
  version: 0.1.0
  description: REST API for the StreamPulse backend.
servers:
  - url: /
tags:
  - name: Health
    description: Operational endpoints.
  - name: Metrics
    description: Observability endpoints.
  - name: Auth
    description: Authentication and password reset endpoints.
  - name: Profile
    description: Current user profile endpoints.
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check API health.
      responses:
        "200":
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    status: ok
        "500":
          $ref: "#/components/responses/InternalError"
  /metrics:
    get:
      tags:
        - Metrics
      operationId: getMetrics
      summary: Expose Prometheus metrics.
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Register a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Authenticate a user and issue tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token pair issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: Rotate a refresh token and issue a new token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token pair rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Revoke the current refresh token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Refresh token revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/forgot-password:
    post:
      tags:
        - Auth
      operationId: forgotPassword
      summary: Request a password reset email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Password reset request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                accepted:
                  value:
                    message: if this email is registered, you will receive a password reset link shortly
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/reset-password:
    post:
      tags:
        - Auth
      operationId: resetPassword
      summary: Reset a password with a valid reset token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                updated:
                  value:
                    message: password updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users/me:
    get:
      tags:
        - Profile
      operationId: getMyProfile
      summary: Retrieve the authenticated user's profile.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - Profile
      operationId: updateMyProfile
      summary: Update the authenticated user's profile.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/streams:
    post:
      tags:
        - Streaming
      operationId: createStream
      summary: Create and configure a new live stream (broadcaster only).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStreamRequest"
      responses:
        "201":
          description: The newly created stream, including its source URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request payload or invalid input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidJson:
              value:
                error:
                  code: invalid_json
                  message: invalid json body
            invalidArgument:
              value:
                error:
                  code: invalid_argument
                  message: invalid email
    Unauthorized:
      description: Authentication failed or bearer token is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: invalid credentials
    Conflict:
      description: Resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            duplicate:
              value:
                error:
                  code: conflict
                  message: email or username already taken
    Forbidden:
      description: Authenticated but the role is insufficient for this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbidden:
              value:
                error:
                  code: forbidden
                  message: insufficient role
    UnsupportedMediaType:
      description: Request content type must be application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unsupported:
              value:
                error:
                  code: unsupported_media_type
                  message: content-type must be application/json
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                error:
                  code: internal
                  message: internal server error
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: ^[a-zA-Z0-9_]+$
          example: alice
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: hunter2hunter
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: hunter2hunter
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          example: 21ee4d0f5e8c4037a61f48c980b9b3e7dba2f1d3b4f2a9f1bb7be6f99f9f5ef9
    LogoutRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          example: 21ee4d0f5e8c4037a61f48c980b9b3e7dba2f1d3b4f2a9f1bb7be6f99f9f5ef9
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 1
          example: a0a6d282d432a44f3a3a7e0d75a742f42df1a7f39a260ebc89b3b961df18dd41
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: newpassword1
    UserResponse:
      type: object
      required:
        - id
        - email
        - username
        - role
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
        email:
          type: string
          format: email
          example: alice@example.com
        username:
          type: string
          example: alice
        role:
          type: string
          example: user
        created_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
    ProfileResponse:
      type: object
      required:
        - id
        - email
        - role
        - pseudo
        - bio
        - avatar_url
        - theme
        - notifications_enabled
        - audio_quality
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
        email:
          type: string
          format: email
          example: alice@example.com
        role:
          type: string
          example: user
        pseudo:
          type: string
          minLength: 3
          maxLength: 30
          example: alice
        bio:
          type: string
          maxLength: 280
          example: Music lover and night owl.
        avatar_url:
          type: string
          format: uri
          nullable: true
          example: https://cdn.streampulse.dev/avatars/alice.png
        theme:
          type: string
          enum: [system, light, dark]
          example: system
        notifications_enabled:
          type: boolean
          example: true
        audio_quality:
          type: string
          enum: [low, normal, high]
          example: normal
        created_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required:
        - pseudo
        - bio
        - theme
        - notifications_enabled
        - audio_quality
      properties:
        pseudo:
          type: string
          minLength: 3
          maxLength: 30
          pattern: ^[a-zA-Z0-9_ ]+$
          example: alice
        bio:
          type: string
          maxLength: 280
          example: Music lover and night owl.
        theme:
          type: string
          enum: [system, light, dark]
          example: dark
        notifications_enabled:
          type: boolean
          example: true
        audio_quality:
          type: string
          enum: [low, normal, high]
          example: high
    TokenPairResponse:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        refresh_token:
          type: string
          example: 21ee4d0f5e8c4037a61f48c980b9b3e7dba2f1d3b4f2a9f1bb7be6f99f9f5ef9
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: invalid_argument
        message:
          type: string
          example: invalid email
    CreateStreamRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - is_public
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
          example: Morning Jazz Session
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: A relaxing jazz set to start the day.
        category:
          type: string
          enum: [music, talk, technology, gaming, news, sport, other]
          nullable: true
          example: music
        is_public:
          type: boolean
          example: true
    StreamResponse:
      type: object
      required:
        - id
        - user_id
        - title
        - description
        - category
        - status
        - is_public
        - stream_key
        - stream_source_url
        - started_at
        - ended_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-2222-3333-4444-555555555555
        user_id:
          type: string
          format: uuid
          example: 99999999-8888-7777-6666-555555555555
        title:
          type: string
          example: Morning Jazz Session
        description:
          type: string
          nullable: true
          example: A relaxing jazz set to start the day.
        category:
          type: string
          nullable: true
          example: music
        status:
          type: string
          enum: [idle, live, ended]
          example: idle
        is_public:
          type: boolean
          example: true
        stream_key:
          type: string
          description: Secret push key for the source URL. Treat as a credential.
          example: 8Jk2xQ7pL3nR5tV9wB1cD4fG6hJ0kM2nP4qS6uW8yA
        stream_source_url:
          type: string
          format: uri
          example: http://localhost:8080/api/streams/ingest/8Jk2xQ7pL3nR5tV9wB1cD4fG6hJ0kM2nP4qS6uW8yA
        started_at:
          type: string
          format: date-time
          nullable: true
        ended_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-01-02T03:04:05Z"
