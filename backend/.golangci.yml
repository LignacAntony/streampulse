version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
  exclusions:
    paths:
      - vendor/
      - ".*\\.pb\\.go$"
      - ".*\\.gen\\.go$"

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - vendor/
      - ".*\\.pb\\.go$"
      - ".*\\.gen\\.go$"
