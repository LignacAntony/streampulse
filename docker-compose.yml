networks:
  streampulse-net:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
  track_storage:

services:

  # ──────────────────────────────────────────
  # Base de données
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    networks:
      - streampulse-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ──────────────────────────────────────────
  # API Go
  # ──────────────────────────────────────────
  api:
    image: ghcr.io/lignacantony/streampulse/api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - streampulse-net
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      GO_ENV: ${GO_ENV}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@streampulse.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      STREAM_INGEST_BASE_URL: ${STREAM_INGEST_BASE_URL:-http://localhost:8080}
      INGEST_RECONNECT_GRACE_SECONDS: ${INGEST_RECONNECT_GRACE_SECONDS:-45}
      INGEST_STOP_TIMEOUT_SECONDS: ${INGEST_STOP_TIMEOUT_SECONDS:-10}
      # Comptage d'audience derrière un reverse proxy (STR-154, ADR 025).
      # false en local ; true uniquement quand Caddy est devant, sinon le
      # compteur d'auditeurs sature à 1.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      # LOG_PRETTY volontairement absent : en conteneur la sortie doit rester
      # du JSON pour la collecte Loki (STR-172, ADR 018).
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Export des traces vers Tempo (STR-164, ADR 020). Vide = tracing off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      # Répertoire de stockage des fichiers audio uploadés (US-05-01, ADR 032),
      # hors répertoire servi, persisté sur le volume track_storage.
      STORAGE_PATH: ${STORAGE_PATH:-/data/tracks}
    volumes:
      - track_storage:/data/tracks
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Email de test — Mailpit (dev uniquement)
  # ──────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    networks:
      - streampulse-net
    ports:
      - "1025:1025"   # SMTP (relay interne)
      - "8025:8025"   # Interface web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Métriques — Prometheus
  # ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    networks:
      - streampulse-net
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Fixée explicitement plutôt qu'héritée du défaut de l'image.
      # 90 jours : les séries sont agrégées et ne portent aucun
      # identifiant d'utilisateur (ADR 019, cardinalité bornée), la
      # durée relève donc du volume disque, pas du RGPD.
      - "--storage.tsdb.retention.time=90d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Agrégation de logs — Loki
  # ──────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    networks:
      - streampulse-net
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    # Image distroless (pas de shell ni wget) — healthcheck via service_started
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Métriques machine — node_exporter (STR-165, ADR 019)
  # En dev sous Docker Desktop : mesure la VM Linux, pas l'hôte macOS —
  # suffisant pour tester le panel Infra ; vraies métriques sur le VPS.
  # ──────────────────────────────────────────
  node_exporter:
    image: prom/node-exporter:latest
    networks:
      - streampulse-net
    # Pas de bind rootfs ici : Docker Desktop (macOS) refuse la propagation
    # rslave sur `/`. Sans lui, node_exporter lit /proc du kernel de la VM —
    # CPU/RAM corrects pour développer le panel Infra. Le compose prod (Linux)
    # monte le vrai rootfs (docker-compose.prod.yml, ADR 019).
    # Image distroless (pas de shell ni wget) — healthcheck via service_started
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Collecte des logs Docker → Loki — Alloy
  # (successeur de Promtail, EOL mars 2026 — cf. ADR 018)
  # ──────────────────────────────────────────
  alloy:
    image: grafana/alloy:latest
    networks:
      - streampulse-net
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Lecture seule du socket Docker : découverte des conteneurs + flux de logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Traces distribuées — Tempo
  # ──────────────────────────────────────────
  tempo:
    image: grafana/tempo:latest
    networks:
      - streampulse-net
    volumes:
      - ./docker/tempo/tempo-config.yml:/etc/tempo/tempo-config.yaml:ro
    command: -config.file=/etc/tempo/tempo-config.yaml
    # Image distroless (pas de shell ni wget) — healthcheck via service_started
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Visualisation — Grafana
  # ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    networks:
      - streampulse-net
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Alertes par email (STR-167, ADR 021) : en dev tout part dans Mailpit
      # (http://localhost:8025) — aucune sortie réseau réelle.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: alertes@streampulse.dev
      GF_SMTP_SKIP_VERIFY: "true"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
