name: Load Test

on:
  workflow_dispatch:
  # Hebdomadaire : le harnais vit sous build tag, donc hors du chemin de la CI
  # de PR. `go vet -tags loadtest` (job Test de la CI) garantit qu'il compile ;
  # ce run garantit qu'il passe encore, et fournit des chiffres datés à l'ADR 016.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  loadtest:
    name: Test de charge HLS (STR-90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Install ffmpeg (segmentation HLS — cf. ADR 015)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run load test
        working-directory: ./backend
        shell: bash
        run: go test -tags loadtest -race -count=1 -run TestLoad -v -timeout 10m ./internal/streaming/loadtest/ 2>&1 | tee loadtest-report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-report
          path: backend/loadtest-report.txt
