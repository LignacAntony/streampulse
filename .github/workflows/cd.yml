name: CD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# Deux CI qui concluent coup sur coup (deux merges rapprochés, ou un merge plus
# un workflow_dispatch) lanceraient deux CD en parallèle : chacune pousse le tag
# `latest` puis fait `docker compose pull` sur le VPS, sans garantie d'ordre —
# la machine pourrait rester sur le plus ancien des deux commits. La file
# n'annule pas le déploiement en cours (couper à mi-parcours laisserait un état
# partiel) ; seule la mise en attente est remplacée par la suivante, donc le
# dernier commit gagne.
concurrency:
  group: cd-production
  cancel-in-progress: false

# Déclenché par la fin de la CI plutôt que par le push : les deux workflows
# démarraient sinon en parallèle sur `push main`, et des tests rouges
# déployaient quand même (STR-241). `workflow_run` porte le SHA du run
# déclencheur, chaque job doit donc le passer explicitement à checkout —
# sans quoi Actions reprendrait la tête de la branche par défaut.
on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    # Deux filtres, pas un.
    #
    # `conclusion` écarte les CI rouges — c'est l'objet de la bascule.
    #
    # `event == 'push'` écarte les CI de pull_request, et ce n'est pas
    # cosmétique : `workflow_run` se déclenche pour *toute* exécution de la CI,
    # y compris celles issues d'une PR, et son filtre `branches` compare le
    # head_branch du run déclencheur. Une PR de fork ouverte depuis une branche
    # nommée `main` produit donc head_branch == main, passe le filtre, et si sa
    # CI conclut success la CD s'exécuterait avec les secrets du dépôt de base
    # sur un commit jamais mergé — la protection de branche ne s'interpose pas.
    #
    # Un workflow_dispatch n'a pas de workflow_run associé, d'où le premier
    # membre qui garde le redéploiement manuel utilisable.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      packages: write
    steps:
      # Sous workflow_run, `github.sha` désigne la tête de la branche par défaut
      # au moment du déclenchement, pas le commit dont la CI vient de passer.
      # Les deux coïncident dans le cas nominal mais divergent dès que deux
      # pushes s'enchaînent — on construirait alors une image étiquetée avec un
      # SHA qu'elle ne contient pas. Résolu une fois, réutilisé partout.
      - name: Résoudre le commit à déployer
        id: target
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=sha-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=${{ steps.target.outputs.short }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/streampulse
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.VPS_GHCR_USER }} --password-stdin
            docker compose pull api
            docker compose up -d --no-deps api
            docker image prune -f

  release:
    name: Create release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Sans cette remontée, `needs.release.outputs.*` serait vide côté job
    # mobile : sa condition ne serait jamais vraie et il ne s'exécuterait
    # jamais, sans que rien ne le signale.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: go

  # Le build mobile est un job de cette workflow, et non un workflow déclenché
  # par `on: release`. Raison : release-please publie la release avec
  # GITHUB_TOKEN, et un événement émis par ce jeton ne déclenche aucun workflow
  # — un `on: release` ne se serait jamais exécuté, sans rien signaler.
  mobile:
    name: Build mobile (Android)
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      # release-please est en mode manifest ici. `releases_created` est fiable,
      # mais `tag_name` ne remonte le tag du composant racine que si l'action
      # expose bien ses sorties sans préfixe. Si ce n'était pas le cas, le job
      # passerait quand même sa condition et n'échouerait qu'à l'upload, après
      # trente minutes de build, sur un `gh release upload ""` illisible.
      #
      # En tête de job et non juste avant l'upload : le tag sert aussi de `ref`
      # au checkout et de nom aux artefacts. Une valeur vide fausse tout ce qui
      # suit, autant s'arrêter avant d'avoir rien construit d'utile.
      - name: Garde — tag de release résolu
        run: |
          [ -n "$TAG" ] || {
            echo "::error::tag_name vide — sortie release-please introuvable (mode manifest ?). Vérifier les outputs du job release."
            exit 1
          }
          echo "release : $TAG"

      # ref explicite : sans lui, checkout prend la tête de la branche par
      # défaut au moment du déclenchement (workflow_run), pas le commit taggé.
      # Deux merges qui s'enchaînent sur main suffisent à publier, sous vX.Y.Z,
      # un binaire bâti depuis un commit plus récent que vX.Y.Z. Même correctif
      # que celui appliqué à build-and-push en #314.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: subosito/flutter-action@v2
        with:
            flutter-version: "3.41.9"
            channel: stable
            cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # La clé de signature n'existe pas tant que personne ne l'a générée. Le
      # job ne doit pas échouer pour autant : un artefact signé en debug reste
      # utile pour installer et tester l'application, il n'est simplement pas
      # distribuable. L'alternative — échouer — bloquerait toute release tant
      # que la clé manque, ce qui est disproportionné.
      # Les QUATRE secrets, pas seulement le keystore. Une configuration
      # partielle est le cas le plus probable — quelqu'un pose la clé et oublie
      # un mot de passe — et c'est celui qui dégradait le plus mal : le keystore
      # était restauré, Gradle voyait un fichier présent et des mots de passe
      # non nuls (un secret GitHub absent référencé dans `env:` vaut la chaîne
      # vide, pas null), signait avec un mot de passe vide, et le build tombait
      # sur une erreur jarsigner qui ne nommait aucun secret.
      #
      # Toute la thèse de ce job est « dégrader, pas échouer » : une config
      # incomplète doit donc dégrader comme une config absente, en nommant ce
      # qui manque.
      - name: Déterminer si la signature de release est disponible
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MANQUANTS=""
          [ -n "$KEYSTORE" ]          || MANQUANTS="$MANQUANTS ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || MANQUANTS="$MANQUANTS ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || MANQUANTS="$MANQUANTS ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || MANQUANTS="$MANQUANTS ANDROID_KEY_PASSWORD"

          if [ -z "$MANQUANTS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "signature de release : les quatre secrets sont présents"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::signature de release indisponible, secret(s) manquant(s) :$MANQUANTS — artefacts signés avec la clé de debug, non distribuables. Cf. docs/distribution-mobile.md"
          fi

      - name: Restaurer le keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Installer les dépendances
        working-directory: ./mobile
        run: flutter pub get

      # --dart-define : sans lui, l'application embarque le défaut
      # `http://localhost:8080` et un APK de release ne joindrait aucune API.
      # L'APK toujours, l'AAB seulement s'il est signable. Un .aab ne s'installe
      # pas — c'est un format d'upload Play Store — et un .aab signé en debug y
      # serait refusé. En mode dégradé il n'irait donc nulle part : l'attacher à
      # la release afficherait un livrable qui ne mène à rien, ce qui est pire
      # que son absence. L'APK, lui, s'installe et sert au test.
      - name: Construire les artefacts
        working-directory: ./mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://api.streampulse.win
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            flutter build appbundle --release \
              --dart-define=API_BASE_URL=https://api.streampulse.win
          fi

      # Le suffixe n'est pas cosmétique : un artefact signé en debug installé
      # par un testeur ne pourra jamais être mis à jour par la version signée,
      # Android refusant un changement de clé. Le nom doit le dire.
      - name: Nommer les artefacts
        id: artifacts
        working-directory: ./mobile
        run: |
          set -euo pipefail
          mkdir -p ../dist
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            SUFFIXE=""
            cp build/app/outputs/bundle/release/app-release.aab \
               "../dist/streampulse-${TAG}.aab"
          else
            SUFFIXE="-NON-SIGNE"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../dist/streampulse-${TAG}${SUFFIXE}.apk"
          ls -lh ../dist

      - name: Attacher les artefacts à la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber
