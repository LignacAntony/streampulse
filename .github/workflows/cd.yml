name: CD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# Deux CI qui concluent coup sur coup (deux merges rapprochés, ou un merge plus
# un workflow_dispatch) lanceraient deux CD en parallèle : chacune pousse le tag
# `latest` puis fait `docker compose pull` sur le VPS, sans garantie d'ordre —
# la machine pourrait rester sur le plus ancien des deux commits. La file
# n'annule pas le déploiement en cours (couper à mi-parcours laisserait un état
# partiel) ; seule la mise en attente est remplacée par la suivante, donc le
# dernier commit gagne.
concurrency:
  group: cd-production
  cancel-in-progress: false

# Déclenché par la fin de la CI plutôt que par le push : les deux workflows
# démarraient sinon en parallèle sur `push main`, et des tests rouges
# déployaient quand même (STR-241). `workflow_run` porte le SHA du run
# déclencheur, chaque job doit donc le passer explicitement à checkout —
# sans quoi Actions reprendrait la tête de la branche par défaut.
on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    # Deux filtres, pas un.
    #
    # `conclusion` écarte les CI rouges — c'est l'objet de la bascule.
    #
    # `event == 'push'` écarte les CI de pull_request, et ce n'est pas
    # cosmétique : `workflow_run` se déclenche pour *toute* exécution de la CI,
    # y compris celles issues d'une PR, et son filtre `branches` compare le
    # head_branch du run déclencheur. Une PR de fork ouverte depuis une branche
    # nommée `main` produit donc head_branch == main, passe le filtre, et si sa
    # CI conclut success la CD s'exécuterait avec les secrets du dépôt de base
    # sur un commit jamais mergé — la protection de branche ne s'interpose pas.
    #
    # Un workflow_dispatch n'a pas de workflow_run associé, d'où le premier
    # membre qui garde le redéploiement manuel utilisable.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      packages: write
    steps:
      # Sous workflow_run, `github.sha` désigne la tête de la branche par défaut
      # au moment du déclenchement, pas le commit dont la CI vient de passer.
      # Les deux coïncident dans le cas nominal mais divergent dès que deux
      # pushes s'enchaînent — on construirait alors une image étiquetée avec un
      # SHA qu'elle ne contient pas. Résolu une fois, réutilisé partout.
      - name: Résoudre le commit à déployer
        id: target
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=sha-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=${{ steps.target.outputs.short }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/streampulse
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ secrets.VPS_GHCR_USER }} --password-stdin
            docker compose pull api
            docker compose up -d --no-deps api
            docker image prune -f

  release:
    name: Create release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Sans cette remontée, `needs.release.outputs.*` serait vide côté job
    # mobile : sa condition ne serait jamais vraie et il ne s'exécuterait
    # jamais, sans que rien ne le signale.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: go

  # Le build mobile est un job de cette workflow, et non un workflow déclenché
  # par `on: release`. Raison : release-please publie la release avec
  # GITHUB_TOKEN, et un événement émis par ce jeton ne déclenche aucun workflow
  # — un `on: release` ne se serait jamais exécuté, sans rien signaler.
  mobile:
    name: Build mobile (Android)
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile/pubspec.yaml
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # La clé de signature n'existe pas tant que personne ne l'a générée. Le
      # job ne doit pas échouer pour autant : un artefact signé en debug reste
      # utile pour installer et tester l'application, il n'est simplement pas
      # distribuable. L'alternative — échouer — bloquerait toute release tant
      # que la clé manque, ce qui est disproportionné.
      - name: Déterminer si la signature de release est disponible
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 absent — artefacts signés avec la clé de debug, non distribuables. Cf. docs/distribution-mobile.md"
          fi

      - name: Restaurer le keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Installer les dépendances
        working-directory: ./mobile
        run: flutter pub get

      # --dart-define : sans lui, l'application embarque le défaut
      # `http://localhost:8080` et un APK de release ne joindrait aucune API.
      - name: Construire l'AAB et l'APK
        working-directory: ./mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://api.streampulse.win
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://api.streampulse.win

      # Le suffixe n'est pas cosmétique : un artefact signé en debug installé
      # par un testeur ne pourra jamais être mis à jour par la version signée,
      # Android refusant un changement de clé. Le nom doit le dire.
      - name: Nommer les artefacts
        id: artifacts
        working-directory: ./mobile
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            SUFFIXE=""
          else
            SUFFIXE="-NON-SIGNE"
          fi
          mkdir -p ../dist
          cp build/app/outputs/bundle/release/app-release.aab \
             "../dist/streampulse-${TAG}${SUFFIXE}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../dist/streampulse-${TAG}${SUFFIXE}.apk"
          ls -lh ../dist

      - name: Attacher les artefacts à la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber
