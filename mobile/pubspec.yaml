name: streampulse
description: Plateforme audio hybride live & on-demand — StreamPulse
publish_to: none
version: 1.2.0+1

environment:
  sdk: ^3.11.4
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0
  toastification: ^3.2.0

  # Client HTTP
  dio: ^5.11.0
  streampulse_api:
    path: packages/streampulse_api

  # Capture microphone AAC/ADTS pour l'ingest du direct (STR-156)
  record: ^6.2.1

  # Sélection de fichier audio pour l'upload d'une piste (US-05-01)
  file_picker: ^8.1.2

  # Stockage sécurisé (tokens JWT)
  flutter_secure_storage: ^10.3.1

  # Préférences non sensibles — niveau sonore du lecteur (STR-244).
  # Séparé de flutter_secure_storage à dessein : celui-ci n'a qu'une
  # responsabilité, les jetons, et un volume n'est pas un secret.
  shared_preferences: ^2.3.0

  # Lecture audio (live HLS + on-demand)
  just_audio: ^0.10.6
  audio_service: ^0.18.19

  # Session audio : focus / interruptions (appels, notifications, casque) — STR-110
  audio_session: ^0.2.4

  # Permission notifications (Android 13+) pour la notification média (STR-109)
  permission_handler: ^11.3.1

  # Typographie
  google_fonts: ^8.2.1

  # Cache hors ligne (US-09-02)
  path_provider: ^2.1.6
  sqflite: ^2.4.3
  connectivity_plus: ^6.0.0

  # Chemins de fichiers
  path: ^1.9.0

  # Utilitaires
  equatable: ^2.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Contrôle du temps virtuel dans les tests (timers de backoff — STR-118)
  fake_async: ^1.3.1

  # Mesure de trames sur appareil (STR-243). `flutter test` simule le temps et
  # ne rastérise rien : un budget de 60 FPS ne s'y vérifie pas.
  integration_test:
    sdk: flutter

  # Génération de code
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.1

  # Linting
  flutter_lints: ^6.0.0

  # Tests HTTP — mock du DioAdapter pour verrouiller le mapping d'erreurs
  # entre le client généré et AuthRemoteDataSource.
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true

  assets:
    # Copies exactes de docs/politique-confidentialite.md et docs/cgu.md.
    # Embarquées et non servies par l'API : la case de consentement de
    # l'inscription doit pouvoir les ouvrir sans réseau et sans compte.
    # `make check-legal-assets` échoue si elles divergent de docs/.
    - assets/legal/
