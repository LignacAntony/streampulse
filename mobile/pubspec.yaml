name: streampulse
description: Plateforme audio hybride live & on-demand — StreamPulse
publish_to: none
version: 1.2.0+1

environment:
  sdk: ^3.11.4
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^18.0.0
  toastification: ^3.2.0

  # Client HTTP
  dio: ^5.4.3+1
  streampulse_api:
    path: packages/streampulse_api

  # Capture microphone AAC/ADTS pour l'ingest du direct (STR-156)
  # Version épinglée, pas de caret (revue PR #382). `AndroidManifest.xml`
  # déclare `com.llfbandit.record.service.AudioRecordingService` — un chemin de
  # classe **interne** au plugin, que rien ne garantit stable entre versions
  # mineures. Un renommage casserait le service de premier plan au runtime
  # (ClassNotFound), donc la capture en arrière-plan, sans qu'aucun test ni la
  # CI ne le voie. Toute montée de version doit revérifier ce nom de classe.
  record: 6.2.1

  # Sélection de fichier audio pour l'upload d'une piste (US-05-01)
  file_picker: ^8.1.2

  # Stockage sécurisé (tokens JWT)
  flutter_secure_storage: ^10.3.1

  # Connexion Google (« Sign in with Google ») : récupère un ID token Google
  # côté appareil, vérifié ensuite par le backend (/api/auth/google).
  google_sign_in: ^6.2.1

  # Préférences non sensibles — niveau sonore du lecteur (STR-244).
  # Séparé de flutter_secure_storage à dessein : celui-ci n'a qu'une
  # responsabilité, les jetons, et un volume n'est pas un secret.
  shared_preferences: ^2.3.0

  # Lecture audio (live HLS + on-demand)
  just_audio: ^0.9.40
  audio_service: ^0.18.12

  # Session audio : focus / interruptions (appels, notifications, casque) — STR-110
  audio_session: ^0.1.25

  # Permission notifications (Android 13+) pour la notification média (STR-109)
  permission_handler: ^11.3.1

  # Typographie
  google_fonts: ^8.2.1

  # Cache hors ligne (US-09-02)
  path_provider: ^2.1.0
  sqflite: ^2.3.0
  connectivity_plus: ^6.0.0

  # Chat en direct (US-09-01) : WebSocket
  web_socket_channel: ^3.0.2

  # Chemins de fichiers
  path: ^1.9.0

  # Utilitaires
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Contrôle du temps virtuel dans les tests (timers de backoff — STR-118)
  fake_async: ^1.3.1

  # Mesure de trames sur appareil (STR-243). `flutter test` simule le temps et
  # ne rastérise rien : un budget de 60 FPS ne s'y vérifie pas.
  integration_test:
    sdk: flutter

  # Génération de code
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # Linting
  flutter_lints: ^6.0.0

  # Tests HTTP — mock du DioAdapter pour verrouiller le mapping d'erreurs
  # entre le client généré et AuthRemoteDataSource.
  http_mock_adapter: ^0.6.1

  # Génération des icônes de lancement (Android mipmaps + adaptive, iOS AppIcon)
  # depuis un master unique. Régénérer après modif de assets/icon/ :
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

# Configuration des icônes de lancement (StreamPulse, motif égaliseur).
# Master : assets/icon/app_icon.png (dégradé violet->teal de la marque + barres).
# Android adaptatif : fond dégradé + barres réduites dans la zone sûre.
# Ces PNG ne sont PAS dans `flutter/assets:` : ils servent uniquement à la
# génération des icônes, pas au bundle applicatif.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    # Copies exactes de docs/politique-confidentialite.md et docs/cgu.md.
    # Embarquées et non servies par l'API : la case de consentement de
    # l'inscription doit pouvoir les ouvrir sans réseau et sans compte.
    # `make check-legal-assets` échoue si elles divergent de docs/.
    - assets/legal/
