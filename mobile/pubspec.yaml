name: streampulse
description: Plateforme audio hybride live & on-demand — StreamPulse
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0
  toastification: ^3.2.0

  # Client HTTP
  dio: ^5.4.3+1
  streampulse_api:
    path: packages/streampulse_api

  # Capture microphone AAC/ADTS pour l'ingest du direct (STR-156)
  record: ^6.2.1

  # Sélection de fichier audio pour l'upload d'une piste (US-05-01)
  file_picker: ^8.1.2

  # Stockage sécurisé (tokens JWT)
  flutter_secure_storage: ^9.0.0

  # Lecture audio (live HLS + on-demand)
  just_audio: ^0.9.40
  audio_service: ^0.18.12

  # Session audio : focus / interruptions (appels, notifications, casque) — STR-110
  audio_session: ^0.1.25

  # Permission notifications (Android 13+) pour la notification média (STR-109)
  permission_handler: ^11.3.1

  # WebSocket (chat live)
  web_socket_channel: ^3.0.1

  # Typographie
  google_fonts: ^6.2.1

  # Cache hors ligne (US-09-02)
  path_provider: ^2.1.0
  sqflite: ^2.3.0
  connectivity_plus: ^6.0.0

  # Chemins de fichiers
  path: ^1.9.0

  # Utilitaires
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Contrôle du temps virtuel dans les tests (timers de backoff — STR-118)
  fake_async: ^1.3.1

  # Génération de code
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # Linting
  flutter_lints: ^4.0.0

  # Tests HTTP — mock du DioAdapter pour verrouiller le mapping d'erreurs
  # entre le client généré et AuthRemoteDataSource.
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
